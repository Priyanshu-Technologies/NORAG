[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "norag"
version = "0.1.0"
description = "Next-generation Orchestrated Retrieval-Augmented Generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "markdown-it-py>=4.2.0",
    "beautifulsoup4>=4.15.0",
    "pypdf>=7.0.0",
    "fastembed>=0.9.1",
    "python-multipart>=0.0.33",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "reportlab>=5.1.0",
]
